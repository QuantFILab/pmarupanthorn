<style>
  @font-face {
    font-family: "TH SarabunPSK";
    src: url("{{ "fonts/th-sarabun-psk-regular.ttf" | relURL }}") format("truetype");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }

  @font-face {
    font-family: "TH SarabunPSK";
    src: url("{{ "fonts/th-sarabun-psk-bold.ttf" | relURL }}") format("truetype");
    font-style: normal;
    font-weight: 700;
    font-display: swap;
  }

  @font-face {
    font-family: "TH SarabunPSK";
    src: url("{{ "fonts/th-sarabun-psk-italic.ttf" | relURL }}") format("truetype");
    font-style: italic;
    font-weight: 400;
    font-display: swap;
  }

  @font-face {
    font-family: "TH SarabunPSK";
    src: url("{{ "fonts/th-sarabun-psk-bold-italic.ttf" | relURL }}") format("truetype");
    font-style: italic;
    font-weight: 700;
    font-display: swap;
  }

  /* TH SarabunPSK has a smaller visual x-height than the English UI font.
     Scale the Thai site at the root so every page and reusable component
     remains comfortably readable without changing the English layout. */
  html[lang^="th"] {
    font-size: 20px !important;
  }

  html[lang^="th"] body,
  html[lang^="th"] button,
  html[lang^="th"] input,
  html[lang^="th"] textarea,
  html[lang^="th"] select {
    font-family: "TH SarabunPSK", "TH Sarabun New", sans-serif !important;
  }

  html[lang^="th"] body {
    font-size: 1.1rem;
    line-height: 1.65;
  }

  html[lang^="th"] h1,
  html[lang^="th"] h2,
  html[lang^="th"] h3,
  html[lang^="th"] h4,
  html[lang^="th"] h5,
  html[lang^="th"] h6 {
    line-height: 1.3;
    letter-spacing: 0 !important;
  }

  html[lang^="th"] .text-xs,
  html[lang^="th"] small,
  html[lang^="th"] time {
    font-size: 0.84rem !important;
    line-height: 1.45;
  }

  html[lang^="th"] .text-sm {
    font-size: 0.96rem !important;
    line-height: 1.55;
  }

  html[lang^="th"] .prose p,
  html[lang^="th"] .prose li,
  html[lang^="th"] .article-style p,
  html[lang^="th"] .article-style li {
    font-size: 1.35rem;
    line-height: 1.55;
  }

  html[lang^="th"] .navbar,
  html[lang^="th"] .navbar-nav {
    font-size: 1.08rem;
  }

  .research-concept-map {
    margin: 0 0 2.25rem;
    border: 1px solid rgb(226 232 240);
    border-radius: 1rem;
    padding: 1.25rem;
    background: linear-gradient(145deg, rgb(248 250 252), rgb(241 245 249));
  }

  .dark .research-concept-map {
    border-color: rgb(51 65 85);
    background: linear-gradient(145deg, rgb(30 41 59), rgb(15 23 42));
  }

  .research-concept-map--image,
  .dark .research-concept-map--image {
    overflow: hidden;
    border: 0;
    padding: 0;
    background: transparent;
  }

  .research-concept-map--image img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 0.75rem;
  }

  .research-concept-map figcaption {
    margin-bottom: 1rem;
    color: rgb(15 23 42);
    font-size: 1.05rem;
    font-weight: 700;
    text-align: center;
  }

  .dark .research-concept-map figcaption {
    color: rgb(241 245 249);
  }

  .research-map-flow {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1.5rem;
    margin: 0 !important;
    padding: 0 !important;
    list-style: none !important;
  }

  .research-map-step {
    position: relative;
    min-height: 10rem;
    border-top: 0.35rem solid var(--research-map-color);
    border-radius: 0.8rem;
    padding: 1rem;
    background: #fff;
    box-shadow: 0 0.4rem 1.2rem rgb(15 23 42 / 0.08);
  }

  .dark .research-map-step {
    background: rgb(30 41 59);
    box-shadow: 0 0.4rem 1.2rem rgb(0 0 0 / 0.2);
  }

  .research-map-step:nth-child(1) { --research-map-color: #2563eb; }
  .research-map-step:nth-child(2) { --research-map-color: #059669; }
  .research-map-step:nth-child(3) { --research-map-color: #d97706; }
  .research-map-step:nth-child(4) { --research-map-color: #7c3aed; }

  .research-map-step:not(:last-child)::after {
    content: "→";
    position: absolute;
    top: 50%;
    right: -1.25rem;
    z-index: 2;
    transform: translateY(-50%);
    color: rgb(100 116 139);
    font-size: 1.5rem;
    font-weight: 700;
  }

  .research-map-number {
    display: inline-grid;
    width: 2rem;
    height: 2rem;
    margin-bottom: 0.55rem;
    place-items: center;
    border-radius: 9999px;
    background: var(--research-map-color);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .research-map-step strong {
    display: block;
    margin-bottom: 0.35rem;
    color: rgb(15 23 42);
    font-size: 1rem;
    line-height: 1.25;
  }

  .dark .research-map-step strong {
    color: rgb(248 250 252);
  }

  .research-map-step p {
    margin: 0 !important;
    color: rgb(71 85 105);
    font-size: 0.92rem !important;
    line-height: 1.4 !important;
  }

  .dark .research-map-step p {
    color: rgb(203 213 225);
  }

  .research-thai-font,
  .research-link-th,
  .research-language-panel--th,
  .research-language-panel--th h2,
  .research-language-panel--th p,
  .research-language-panel--th li,
  .research-language-panel--th strong,
  .research-language-panel--th figcaption {
    font-family: "TH SarabunPSK", "TH Sarabun New", sans-serif !important;
  }

  html[lang^="th"] .research-link-en {
    display: none !important;
  }

  html[lang^="th"] .research-link-th {
    display: inline !important;
  }

  html:not([lang^="th"]) .research-link-th {
    display: none !important;
  }

  .research-language-panel--th {
    font-size: 1.65rem;
    line-height: 1.55;
  }

  .research-language-panel--th h2 {
    margin-top: 2rem;
    margin-bottom: 0.65rem;
    font-size: 2.2rem !important;
    line-height: 1.2 !important;
  }

  .research-language-panel--th p,
  .research-language-panel--th li {
    font-size: 1.65rem !important;
    line-height: 1.55 !important;
  }

  .research-language-panel--th .research-map-step strong {
    font-size: 1.45rem;
    line-height: 1.1;
  }

  .research-language-panel--th .research-map-step p {
    font-size: 1.25rem !important;
    line-height: 1.25 !important;
  }

  .research-language-button.research-thai-font,
  .research-link-th {
    font-size: 1.35rem;
    line-height: 1;
  }

  .research-thai-title {
    font-family: "TH SarabunPSK", "TH Sarabun New", sans-serif !important;
    font-size: 3rem !important;
    line-height: 1.15 !important;
    letter-spacing: 0 !important;
  }

  @media (max-width: 900px) {
    .research-map-flow {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .research-map-step:nth-child(2)::after {
      display: none;
    }
  }

  @media (max-width: 640px) {
    .research-map-flow {
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .research-map-step {
      min-height: 0;
    }

    .research-map-step::after {
      display: none !important;
    }

    .research-thai-title {
      font-size: 2.45rem !important;
    }
  }
</style>
